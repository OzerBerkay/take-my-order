server:
  port: 8184

customer-service:
  customer-topic-name: customer
  outbox-scheduler-fixed-rate: 10000 # 10 saniyede bir çalış
  outbox-scheduler-initial-delay: 10000 # Başladıktan 10 sn sonra ilk işi yap

spring:
  jpa:
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=customer&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: NEVER
      schema-locations: classpath:init-schema.sql
      platform: postgres

kafka-config:
  bootstrap-servers: localhost:19092, localhost:29092, localhost:39092
  schema-registry-url-key: schema.registry.url
  schema-registry-url: http://localhost:8081
  num-of-partitions: 3
  replication-factor: 3

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

keycloak:
  server-url: http://localhost:9090
  realm: take-my-order
  master-realm: master
  admin-client-id: admin-cli
  admin-username: admin      # Keycloak yönetim paneli kullanıcısı
  admin-password: admin      # Keycloak yönetim paneli şifresi