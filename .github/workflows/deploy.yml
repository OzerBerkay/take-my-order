name: Build and Push Microservices

on:
  push:
    branches: [ "prod" ]  # Sadece prod branch'e push gelince çalışır
  workflow_dispatch:      # GitHub arayüzünden manuel tetiklemek için

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Kodları Çek
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 21 Kurulumu
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Maven paketlerini önbelleğe al (Hızlandırır)

      # 3. Maven ile Derle (Yemek Pişirme)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Docker Hub'a Giriş Yap
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Gateway Service (Build & Push)
      - name: Build & Push Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          file: ./gateway-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gateway-service:v1
          no-cache: true

      # 6. Customer Service (Build & Push)
      - name: Build & Push Customer Service
        uses: docker/build-push-action@v5
        with:
          context: ./customer-service
          file: ./customer-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/customer-service:v1
          no-cache: true

      # 7. Order Service (Build & Push)
      - name: Build & Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          file: ./order-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:v1
          no-cache: true

      # 8. Payment Service (Build & Push)
      - name: Build & Push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          file: ./payment-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/payment-service:v1
          no-cache: true

      # 9. Restaurant Service (Build & Push)
      - name: Build & Push Restaurant Service
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          file: ./restaurant-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/restaurant-service:v1
          no-cache: true