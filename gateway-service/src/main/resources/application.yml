server:
  port: ${GATEWAY_SERVICE_PORT:8080}

logging:
  level:
    com.berkay: ${LOG_LEVEL:DEBUG}

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:30080}/realms/${KEYCLOAK_REALM:take-my-order-realm}
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:30080}/realms/${KEYCLOAK_REALM:take-my-order-realm}/protocol/openid-connect/certs
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:4200}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8184}
          predicates:
            - Path=/auth/**,/admin/**,/merchant/**,/users/**,/roles/**,/permissions/**

        - id: order-service
          # localhost is for if you run gateway-service and order-service on ide
          uri: ${ORDER_SERVICE_URI:http://localhost:8181}
          predicates:
            - Path=/orders/**


        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8182}
          predicates:
            - Path=/payments/**,/wallets/**

        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URI:http://localhost:8183}
          predicates:
            - Path=/restaurants/**,/public/restaurants/**,/cuisines/**,/public/cuisines/**
            
        - id: identity-swagger
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8184}
          predicates:
            - Path=/api-docs/identity
          filters:
            - RewritePath=/api-docs/identity, /v3/api-docs
            
        - id: order-swagger
          uri: ${ORDER_SERVICE_URI:http://localhost:8181}
          predicates:
            - Path=/api-docs/order
          filters:
            - RewritePath=/api-docs/order, /v3/api-docs
            
        - id: payment-swagger
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8182}
          predicates:
            - Path=/api-docs/payment
          filters:
            - RewritePath=/api-docs/payment, /v3/api-docs
            
        - id: restaurant-swagger
          uri: ${RESTAURANT_SERVICE_URI:http://localhost:8183}
          predicates:
            - Path=/api-docs/restaurant
          filters:
            - RewritePath=/api-docs/restaurant, /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus  # Prometheus'u dışarı açıyoruz
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name} # Grafana'da hangi servis olduğunu anlamak için
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:30094/api/v2/spans}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}  # %100 oranında tüm istekleri izle (Production'da bu değer 0.1 yapılır)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    urls:
      - name: Identity API
        url: /api-docs/identity
      - name: Order API
        url: /api-docs/order
      - name: Payment API
        url: /api-docs/payment
      - name: Restaurant API
        url: /api-docs/restaurant
