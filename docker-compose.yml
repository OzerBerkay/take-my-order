version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.5
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.2.5
    depends_on:
      - zookeeper
    ports:
      - "31091:19092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONNECTIONS_FROM_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CONNECTIONS_FROM_HOST://localhost:31091
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONNECTIONS_FROM_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

  kafka-2:
    image: confluentinc/cp-kafka:7.2.5
    depends_on:
      - zookeeper
    ports:
      - "31092:19092"
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONNECTIONS_FROM_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,CONNECTIONS_FROM_HOST://localhost:31092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONNECTIONS_FROM_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

  kafka-3:
    image: confluentinc/cp-kafka:7.2.5
    depends_on:
      - zookeeper
    ports:
      - "31093:19092"
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONNECTIONS_FROM_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,CONNECTIONS_FROM_HOST://localhost:31093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONNECTIONS_FROM_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

  schema-registry:
    image: confluentinc/cp-schema-registry:7.2.5
    depends_on:
      - kafka
    ports:
      - "30081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ============================================================================
  # OPTIONAL: Containerized PostgreSQL 16 for Mode A (Port 5433)
  # ============================================================================
  # By default, Mode A uses a bare-metal host PostgreSQL 16 instance on port 5432.
  # If you do NOT want to install or touch a local bare-metal PostgreSQL:
  #   1) Uncomment the `postgres` service block below.
  #   2) In the `keycloak` service below, swap `KC_DB_URL` to the `postgres:5432` line
  #      and uncomment `depends_on: - postgres`.
  #   3) Pass `DB_PORT=5433` in IntelliJ Run Configurations for the 4 domain services.
  # Note: Always run `docker compose down` before switching to Mode B (Local K8s).
  #
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: takemyorder
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: admin
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - ./local-env/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  #     - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_DB: postgres
      # Default (Mode A - Bare-Metal Host PostgreSQL on :5432):
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/takemyorder?currentSchema=keycloak
      # Optional (Docker Postgres on :5433 — uncomment if enabling the `postgres` service above):
      # KC_DB_URL: jdbc:postgresql://postgres:5432/takemyorder?currentSchema=keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "30080:8080"
    # Uncomment if enabling the optional `postgres` service above:
    # depends_on:
    #   - postgres
    volumes:
      - ./local-env/keycloak:/opt/keycloak/data/import

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
      - kafka-2
      - kafka-3
      - schema-registry
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "30094:9411"

volumes:
  postgres-data:
