server:
  port: ${PAYMENT_SERVICE_PORT:8182}

logging:
  level:
    com.berkay: ${LOG_LEVEL:DEBUG}

payment-service:
  init:
    reset-db: ${RESET_DB:false}
  payment-request-topic-name: payment-request
  payment-response-topic-name: payment-response
  customer-topic-name: customer
  restaurant-information-topic-name: restaurant-information
  role-topic-name: identity-role-events
  permission-topic-name: identity-permission-events
  outbox-scheduler-fixed-rate: 10000
  outbox-scheduler-initial-delay: 10000

security:
  rbac:
    domain-policies:
      CUSTOMER: ORDER, RESTAURANT
      MERCHANT: ORDER, RESTAURANT
      INTERNAL: IDENTITY, ORDER, PAYMENT, RESTAURANT

spring:
  application:
    name: payment-service
  jpa:
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    # Not: Bare metal olarak kurulu olan Postgres ile Docker üzerine kurulu Postgres'in birbirinden ayrılması için DB_PORT 5433 olarak ayarlanmıştır.
    url: jdbc:postgresql://${MASTER_PRIVATE_IP:localhost}:${DB_PORT:5433}/takemyorder?currentSchema=payment&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
    baseline-on-migrate: true
    baseline-version: 1
    schemas: payment
    locations: classpath:db/migration

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:31091,localhost:31092,localhost:31093}
  schema-registry-url-key: schema.registry.url
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:30081}
  num-of-partitions: 3
  replication-factor: 3

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: ${KAFKA_PRODUCER_CONFIG_COMPRESSION_TYPE:none}
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
  payment-consumer-group-id: payment-topic-consumer
  customer-group-id: customer-topic-consumer
  restaurant-information-consumer-group-id: restaurant-information-topic-consumer
  role-consumer-group-id: payment-role-topic-consumer
  permission-consumer-group-id: payment-permission-topic-consumer
  auto-offset-reset: earliest
  specific-avro-reader-key: specific.avro.reader
  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus  # Prometheus'u dışarı açıyoruz
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name} # Grafana'da hangi servis olduğunu anlamak için
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:30094/api/v2/spans}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0} # %100 oranında tüm istekleri izle (Production'da bu değer 0.1 yapılır)