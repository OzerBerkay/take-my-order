# -----------------------------
# BROKER 1
# -----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker-1
  namespace: take-my-order
  labels:
    app: kafka-broker-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker-1
  template:
    metadata:
      labels:
        app: kafka-broker-1
    spec:
      containers:
        - name: kafka-broker-1
          image: confluentinc/cp-kafka:7.2.5
          ports:
            - containerPort: 19092 # Dış erişim portu
            - containerPort: 9092 # Cluster içi erişim portu
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-broker-1:9092,LISTENER_LOCAL://localhost:19092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,LISTENER_LOCAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_COMPRESSION_TYPE
              value: "producer"
          volumeMounts:
            - name: kafka-broker-1-storage
              mountPath: /var/lib/kafka/data
      volumes:
        - name: kafka-broker-1-storage
          persistentVolumeClaim:
            claimName: kafka-broker-1-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker-1
  namespace: take-my-order
spec:
  ports:
    - name: external
      port: 19092
      targetPort: 19092
    - name: internal
      port: 9092
      targetPort: 9092
  selector:
    app: kafka-broker-1

---
