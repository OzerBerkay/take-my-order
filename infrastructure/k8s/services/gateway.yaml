apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: take-my-order
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: berkayozr/gateway-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "300Mi"
              cpu: "300m"
            limits:
              memory: "800Mi"
              cpu: "1000m"
          env:
            - name: SERVER_PORT
              value: "8080"
            # Application.yml içinde ${KEYCLOAK_ISSUER_URI} kullanıyorduk.
            # Onu burada K8s içindeki adrese eşitliyoruz.
            - name: KEYCLOAK_ISSUER_URI
              value: "http://keycloak-service:8080/realms/take-my-order"

          # ConfigMap ve Secret'tan TOPLU İçe Aktarım
          # Burası sayesinde ORDER_SERVICE_URI vb. otomatik yüklenir.
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: service-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: take-my-order
spec:
  type: ClusterIP # Ingress arkasında olduğu için ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
