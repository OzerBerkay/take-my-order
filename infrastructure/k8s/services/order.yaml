apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: take-my-order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: berkay/order-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8181
          env:
            - name: SERVER_PORT
              value: "8181"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: DB_PORT
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/postgres?currentSchema=order&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SCHEMA_REGISTRY_URL

            # --- compression type ---
            - name: KAFKA_PRODUCER_CONFIG_COMPRESSION_TYPE
              value: "none"

            # SAGA için gerekli servis URL'leri (Kubernetes Service İsimleri)
            - name: SERVICE_ENDPOINTS_RESTAURANT_SERVICE_URI
              value: "http://restaurant-service"
            - name: SERVICE_ENDPOINTS_CUSTOMER_SERVICE_URI
              value: "http://customer-service"
            - name: SERVICE_ENDPOINTS_PAYMENT_SERVICE_URI
              value: "http://payment-service"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: take-my-order
spec:
  selector:
    app: order
  ports:
    - name: http
      port: 80
      targetPort: 8181