---
# Schema Registry
# Kubernetes kümesi dışındaki IDE (IntelliJ/Eclipse vb.) üzerinden çalışan mikroservislerin Schema Registry'ye erişebilmesi için NodePort yapılandırması gereklidir.
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-service
  namespace: take-my-order
spec:
  type: NodePort
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081

# ---------------------------------------------------------
# BÖLÜM 2: KAFKA ADRESLERİNİ DEĞİŞTİRME (Deployment Patch)
# ---------------------------------------------------------

---
# Kafka Broker 1 - Config Patch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker-1
  namespace: take-my-order
spec:
  template:
    spec:
      containers:
        - name: kafka-broker-1
          env:
            - name: KAFKA_ADVERTISED_LISTENERS
              # Dev ortamında olduğumuz için dış adresi 31091 olarak değiştiriyoruz!
              value: PLAINTEXT://kafka-broker-1:9092,LISTENER_LOCAL://localhost:31091
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,LISTENER_LOCAL://0.0.0.0:19092
---
# Kafka Broker 2 - Config Patch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker-2
  namespace: take-my-order
spec:
  template:
    spec:
      containers:
        - name: kafka-broker-2
          env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-broker-2:9092,LISTENER_LOCAL://localhost:31092
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,LISTENER_LOCAL://0.0.0.0:29092
---
# Kafka Broker 3 - Config Patch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker-3
  namespace: take-my-order
spec:
  template:
    spec:
      containers:
        - name: kafka-broker-3
          env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-broker-3:9092,LISTENER_LOCAL://localhost:31093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,LISTENER_LOCAL://0.0.0.0:39092