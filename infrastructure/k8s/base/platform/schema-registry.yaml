apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: take-my-order
  labels:
    app: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      nodeSelector:
        node-type: infra
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.2.5
          ports:
            - containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry-service"
            - name: SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL
              value: "zookeeper:2181"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
              # Preventing Single Point of Failure with 3 replicas and 9092 standard kafka port
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka-broker-1:9092,PLAINTEXT://kafka-broker-2:9092,PLAINTEXT://kafka-broker-3:9092"
            - name: SCHEMA_REGISTRY_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SCHEMA_REGISTRY_DEBUG
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-service
  namespace: take-my-order
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: schema-registry