# -----------------------------
# BROKER 1
# -----------------------------
apiVersion: apps/v1
kind: Deployment #Bana bir uygulama çalıştır denilen kısım
metadata:
  name: kafka-broker-1
  namespace: take-my-order
  labels:
    app: kafka-broker-1
spec:
  replicas: 1 # Bu brokerdan kaç kopya olsun? Kafka stateful (durum tutan) bir yapı olduğu için her broker biriciktir, bu yüzden 1 tane çalıştırıyoruz.
  selector:
    matchLabels:
      app: kafka-broker-1
  template:
    metadata:
      labels:
        app: kafka-broker-1
    spec:
      nodeSelector:
        node-type: infra
      containers:
        - name: kafka-broker-1
          image: confluentinc/cp-kafka:7.2.5
          ports:
            - containerPort: 19092 # Dış erişim portu
            - containerPort: 9092 # Kafka'nın standart İç Hattı. (Cluster içindeki diğer brokerlar ve servisler buradan konuşacak).
          env:
            - name: KAFKA_BROKER_ID
              value: "1"

              #Kafka, durum bilgisini Zookeeper'da tutar.
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"

            - name: KAFKA_ADVERTISED_LISTENERS
              # Overlay dosyası burayı ezecek.
              value: PLAINTEXT://kafka-broker-1:9092,LISTENER_LOCAL://localhost:19092

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,LISTENER_LOCAL:PLAINTEXT

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"

            # Veriyi yollayan (Producer) nasıl sıkıştırdıysa (Gzip, Snappy vb.) öyle sakla, elleme.
            - name: KAFKA_COMPRESSION_TYPE
              value: "producer"

          #Kafka verilerini konteynerin içinde bu klasöre yazar.
          volumeMounts:
            - name: kafka-broker-1-storage
              mountPath: /var/lib/kafka/data
      # klasörü sanal bir diske (kafka-broker-1-pvc) bağlar. Konteyner çöküp yeniden başlasa bile veriler bu dış diskte olduğu için silinmez.
      volumes:
        - name: kafka-broker-1-storage
          persistentVolumeClaim:
            claimName: kafka-broker-1-pvc
---
apiVersion: v1
kind: Service # Kubernetes'in ağ yönlendirme elemanı.
metadata:
  name: kafka-broker-1
  namespace: take-my-order
spec:
  type: NodePort
  ports:
    - name: external # Servise 19092'den gelen istekleri, arkadaki konteynerin 19092 portuna (Dış Hat) yönlendirir.
      port: 19092
      nodePort: 31091 # Dışarıdan kafkaya istek atacak olan mikroservislerin kullanacağı portlar
      targetPort: 19092
    - name: internal # Servise 9092'den gelen istekleri, arkadaki konteynerin 9092 portuna (İç Hat) yönlendirir.
      port: 9092
      nodePort: 32091
      targetPort: 9092
  selector:
    app: kafka-broker-1 # Bu servis, app=kafka-broker-1 etiketine sahip olan Pod'lara (yukarıdaki Deployment'a) trafik yollar.

---
