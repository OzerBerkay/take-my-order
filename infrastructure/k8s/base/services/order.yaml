apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: take-my-order
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: berkayozr/order-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8181
          resources:
            requests:
              memory: "300Mi"
              cpu: "300m"
            limits:
              memory: "800Mi"
              cpu: "1000m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SPRING_PROFILES_ACTIVE

            - name: ORDER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: ORDER_SERVICE_PORT

            - name: MASTER_PRIVATE_IP
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: MASTER_PRIVATE_IP

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: DB_PORT
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/postgres?currentSchema=order&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SCHEMA_REGISTRY_URL

            - name: TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: TRACING_SAMPLING_PROBABILITY

            # --- compression type ---
            - name: KAFKA_PRODUCER_CONFIG_COMPRESSION_TYPE
              value: "none"

            # SAGA için gerekli servis URL'leri (Kubernetes Service İsimleri)
            - name: SERVICE_ENDPOINTS_RESTAURANT_SERVICE_URI
              value: "http://restaurant-service"
            - name: SERVICE_ENDPOINTS_CUSTOMER_SERVICE_URI
              value: "http://customer-service"
            - name: SERVICE_ENDPOINTS_PAYMENT_SERVICE_URI
              value: "http://payment-service"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: take-my-order
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: 8181