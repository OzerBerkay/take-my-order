apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: take-my-order
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      nodeSelector:
        node-type: app
      containers:
        - name: order-service
          image: berkayozr/order-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8181
          resources:
            requests:
              memory: "300Mi"
              cpu: "300m"
            limits:
              memory: "800Mi"
              cpu: "1000m"

          # Self-Healing Spring Boot'un /actuator/health adresi, uygulamanın nabzıdır. Eğer veritabanı bağlantısı koparsa bu adres DOWN döner
          # ve Kubernetes bunu görüp "Bu pod bozulmuş, yeniden başlatayım" der.
          livenessProbe: # Kubernetes, Pod'un içine sürekli "Hey, orada mısın?" diye sorar.
            httpGet:
              path: /actuator/health
              port: 8181
            initialDelaySeconds: 90  # İlk kontrol için 1.5 dakika bekle (ARM yavaşlığı için)
            periodSeconds: 10        # 10 saniyede bir kontrol et
            timeoutSeconds: 5
            failureThreshold: 10     # 10 kere başarısız olursa restart at

          readinessProbe: # Kubernetes, "Trafiği sana yönlendireyim mi, yoksa hala veritabanına bağlanmaya mı çalışıyorsun?" diye sorar.
            httpGet:
              path: /actuator/health
              port: 8181
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SPRING_PROFILES_ACTIVE

            - name: ORDER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: ORDER_SERVICE_PORT

            - name: MASTER_PRIVATE_IP
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: MASTER_PRIVATE_IP

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: DB_PORT

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            - name: SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SCHEMA_REGISTRY_URL

            - name: TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: TRACING_SAMPLING_PROBABILITY

            # --- compression type ---
            - name: KAFKA_PRODUCER_CONFIG_COMPRESSION_TYPE
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KAFKA_PRODUCER_CONFIG_COMPRESSION_TYPE

            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: ZIPKIN_URL

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: take-my-order
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: 8181