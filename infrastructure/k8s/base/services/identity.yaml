apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service # Deployment İsmi
  namespace: take-my-order
  labels:
    app: identity-service # Deployment Etiketi
spec:
  replicas: 1 # Kaç kopya çalışacak?
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Önce yeni versiyon pod'unu eski pod'un yanında ayağa kaldır
      maxUnavailable: 0  # Yeni pod hazır (Ready) olana kadar eski pod'u asla kapatma (Sıfır Kesinti)
  selector:
    matchLabels:
      app: identity-service # Pod Seçicisi
  template:
    metadata:
      labels:
        app: identity-service # Pod Etiketi
    spec:
      nodeSelector:
        node-type: app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - identity-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: identity-service # Konteyner İsmi
          image: berkayozr/identity-service:v1 # Dockerhub'da build ettiğimiz imaj
          # Jenkins ile doğrudan K3s içine aktarılan yerel imajı kullanır (Docker Hub'a ASLA çıkmaz).
          # NOT: Eğer GitHub Actions Push-Based & Docker Hub stratejisi kullanılacaksa bu değer "Always" yapılmalıdır.
          imagePullPolicy: Never
          ports:
            - containerPort: 8184           # Application.yml içindeki identity portu
          resources:
            requests:
              memory: "300Mi"
              cpu: "300m"
            limits:
              memory: "800Mi"
              cpu: "1000m"

          # Self-Healing Spring Boot'un /actuator/health adresi, uygulamanın nabzıdır. Eğer veritabanı bağlantısı koparsa bu adres DOWN döner
          # ve Kubernetes bunu görüp "Bu pod bozulmuş, yeniden başlatayım" der.
          livenessProbe: # Kubernetes, Pod'un içine sürekli "Hey, orada mısın?" diye sorar.
            httpGet:
              path: /actuator/health
              port: 8184
            initialDelaySeconds: 90  # İlk kontrol için 1.5 dakika bekle (ARM yavaşlığı için)
            periodSeconds: 10        # 10 saniyede bir kontrol et
            timeoutSeconds: 5
            failureThreshold: 10     # 10 kere başarısız olursa restart at

          readinessProbe: # Kubernetes, "Trafiği sana yönlendireyim mi, yoksa hala veritabanına bağlanmaya mı çalışıyorsun?" diye sorar.
            httpGet:
              path: /actuator/health
              port: 8184
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          env:
            - name: IDENTITY_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: IDENTITY_SERVICE_PORT

            # --- Veritabanı Ayarları (ConfigMap ve Secret'tan) ---
            - name: MASTER_PRIVATE_IP
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: MASTER_PRIVATE_IP

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: DB_PORT

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: DB_PASSWORD

            # 👇 --- KEYCLOAK AYARLARI ---
            - name: KEYCLOAK_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KEYCLOAK_SERVER_URL

            - name: MASTER_PUBLIC_IP
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: MASTER_PUBLIC_IP

            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: KEYCLOAK_ISSUER_URI

            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KEYCLOAK_REALM

            - name: KEYCLOAK_MASTER_REALM
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KEYCLOAK_MASTER_REALM

            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KEYCLOAK_ADMIN_CLIENT_ID

            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: KEYCLOAK_ADMIN_USERNAME

            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD

            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KEYCLOAK_CLIENT_ID

            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: service-secrets
                  key: KEYCLOAK_CLIENT_SECRET


              # --- compression type ---
            - name: KAFKA_PRODUCER_CONFIG_COMPRESSION_TYPE
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KAFKA_PRODUCER_CONFIG_COMPRESSION_TYPE

            # --- Kafka Ayarları ---
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            - name: SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SCHEMA_REGISTRY_URL

            - name: TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: TRACING_SAMPLING_PROBABILITY

            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: ZIPKIN_URL

            # --- Redis Ayarları ---
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SPRING_DATA_REDIS_HOST

            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SPRING_DATA_REDIS_PORT

            # --- Diğer Ayarlar ---
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: LOG_LEVEL

            - name: SHOW_SQL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SHOW_SQL

            - name: SWAGGER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SWAGGER_ENABLED
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service # Gateway buna bu isimle ulaşacak Servis İsmi
  namespace: take-my-order
spec:
  type: ClusterIP
  selector:
    app: identity-service # Servis Bağlantısı
  ports:
    - name: http
      port: 80
      targetPort: 8184
