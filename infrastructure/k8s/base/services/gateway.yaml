apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: take-my-order
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: berkayozr/gateway-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "300Mi"
              cpu: "300m"
            limits:
              memory: "800Mi"
              cpu: "1000m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: SPRING_PROFILES_ACTIVE

            - name: GATEWAY_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: GATEWAY_SERVICE_PORT

            - name: KEYCLOAK_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KEYCLOAK_SERVER_URL # http://keycloak-service:8080 veya IP

            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: KEYCLOAK_REALM

            - name: TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: TRACING_SAMPLING_PROBABILITY

            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: ZIPKIN_URL

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: take-my-order
spec:
  type: ClusterIP # Ingress arkasında olduğu için ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
